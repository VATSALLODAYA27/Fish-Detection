<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Fish Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0c4a6e 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Navbar Styles */
        nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 1rem 5%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(100, 200, 255, 0.2);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .logo i {
            font-size: 2.2rem;
            color: #0ea5e9;
            animation: swim 4s infinite ease-in-out;
        }

        .logo:hover {
            transform: scale(1.05);
            color: #7dd3fc;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.05rem;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }

        .nav-links a.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            font-weight: 600;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: #38bdf8;
            border-radius: 2px;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 2rem;
            margin-top: 80px;
        }

        .hero h1 {
            font-size: 4.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
        }

        .hero p {
            font-size: 1.4rem;
            max-width: 700px;
            line-height: 1.7;
            margin-bottom: 2rem;
            color: #94a3b8;
        }

        .cta-button {
            padding: 1rem 2.5rem;
            background: #38bdf8;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-5px);
            background: #0ea5e9;
            box-shadow: 0 15px 40px rgba(14, 165, 233, 0.5);
        }

        /* Fish swimming animation */
        @keyframes swim {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }

        @media (max-width: 768px) {
            .nav-links {
                gap: 1rem;
            }
            .hero h1 {
                font-size: 3rem;
            }
            .hero p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <!-- Logo -->
            <a href="#" class="logo">
                <i class="fas fa-fish"></i>
                Fish Detection
            </a>

            <!-- Navigation Links -->
            <ul class="nav-links">
                <li><a href="{{url_for('index')}}" class="active">Home</a></li>
                <li><a href="{{url_for('about')}}">About</a></li>
                <li><a href="{{url_for('login')}}">Login</a></li>
                <li><a href="{{url_for('register')}}">Register</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Fish Detection System</h1>
        <p>Advanced AI-powered underwater fish detection and species identification using cutting-edge computer vision technology.</p>
        <button class="cta-button">Get Started</button>
    </section>

</body>
</html>
