<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register - Fish Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0c4a6e 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* EXACT SAME NAVBAR AS HOME & LOGIN PAGE */
        nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 1rem 5%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(100, 200, 255, 0.2);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .logo i {
            font-size: 2.2rem;
            color: #0ea5e9;
            animation: swim 4s infinite ease-in-out;
        }

        .logo:hover {
            transform: scale(1.05);
            color: #7dd3fc;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.05rem;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }

        .nav-links a.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            font-weight: 600;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: #38bdf8;
            border-radius: 2px;
        }

        /* Register Form Styling */
        .register-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            margin-top: 100px;
        }

        .register-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.2);
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        .register-card h2 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .register-card p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .register-btn {
            width: 100%;
            padding: 1rem;
            background: #38bdf8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 1rem;
        }

        .register-btn:hover {
            background: #0ea5e9;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4);
        }

        .message {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 500;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .extra-links {
            margin-top: 2rem;
            font-size: 0.95rem;
        }

        .extra-links a {
            color: #38bdf8;
            text-decoration: none;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        @keyframes swim {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }

        @media (max-width: 768px) {
            .nav-links {
                gap: 1rem;
            }
            .register-card {
                padding: 2.5rem 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- EXACT SAME NAVBAR - "Register" is now active -->
    <nav>
        <div class="nav-container">
            <a href="/" class="logo">
                <i class="fas fa-fish"></i>
                Fish Detection
            </a>

            <ul class="nav-links">
                <li><a href="{{url_for('index')}}">Home</a></li>
                <li><a href="{{url_for('about')}}">About</a></li>
                <li><a href="{{url_for('login')}}">Login</a></li>
                <li><a href="{{url_for('register')}}" class="active">Register</a></li>
            </ul>
        </div>
    </nav>

    <!-- Register Form -->
    <div class="register-container">
        <div class="register-card">
            <h2>Create Account</h2>
            <p>Join the Fish Detection System today</p>

            <form action="{{url_for('register')}}" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required />
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required />
                </div>

                <div class="form-group">
                    <label for="c_password">Confirm Password</label>
                    <input type="password" id="c_password" name="c_password" placeholder="••••••••" required />
                </div>

                <button type="submit" class="register-btn">Register</button>
            </form>

            <!-- Display error messages from Flask (e.g. password mismatch, email exists) -->
            {% if message %}
                <div class="message">{{ message }}</div>
            {% endif %}

            <div class="extra-links">
                <p>Already have an account? <a href="{{url_for('login')}}">Login here</a></p>
            </div>
        </div>
    </div>

</body>
</html>
